<style>
:root{

}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--night);color:var(--ink);overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.title{position:fixed;top:var(--gut);left:var(--gut);writing-mode:vertical-rl;font-family:var(--serif);display:flex;gap:14px;align-items:flex-start;pointer-events:none}
.title h1{font-weight:600;font-size:22px;letter-spacing:.42em;color:var(--ink)}
.title p{font-size:12px;letter-spacing:.3em;color:var(--ink-2)}

.key{position:fixed;top:var(--gut);right:var(--gut);width:272px;padding:18px 20px 16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:linear-gradient(rgba(11,18,32,.72),rgba(11,18,32,.72))}
.lenses{display:flex;gap:20px;margin-bottom:16px}
.lenses button{font-family:var(--serif);font-size:16px;letter-spacing:.12em;color:var(--ink-2);padding:6px 0 7px;border-bottom:1px solid transparent;min-height:36px;transition:color .2s,border-color .2s}
.lenses button:hover{color:var(--ink)}
.lenses button[aria-pressed=true]{color:var(--gold-hi);border-bottom-color:var(--gold)}
.lenses button:focus-visible,.play:focus-visible,.track:focus-visible{outline:1px dashed var(--gold);outline-offset:4px}
.ramp{height:6px;border-radius:0;margin:4px 0 6px}
.ramp-labels span{position:absolute;top:0;white-space:nowrap}
.ramp-labels{position:relative;height:14px;font-size:11px;color:var(--ink-2);font-feature-settings:"palt"}
.key .desc{margin-top:12px;font-size:12px;line-height:1.75;color:var(--ink-2)}

.key .swatches i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

.era{position:fixed;left:var(--gut);bottom:132px;pointer-events:none}
.era .yr{font-family:var(--serif);font-weight:400;font-size:clamp(84px,10vw,152px);line-height:.86;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:lining-nums}
.era .yr small{font-size:.22em;letter-spacing:.2em;color:var(--ink-2);margin-left:.4em;vertical-align:.25em}

.era .tot b{font-weight:600;font-size:26px;color:var(--gold-hi);letter-spacing:.02em;margin:0 .2em;font-variant-numeric:tabular-nums}
.era .tot span.ix{display:block;font-size:12px;margin-top:4px;letter-spacing:.08em}

.time{position:fixed;left:var(--gut);right:var(--gut);bottom:34px;display:flex;align-items:center;gap:22px}
.play{flex:0 0 52px;height:52px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;transition:background .2s}
.play:hover{background:rgba(201,164,76,.12)}
.play:active{background:rgba(201,164,76,.22)}
.play svg{width:16px;height:16px;fill:var(--gold-hi)}
.track{position:relative;flex:1;height:52px;cursor:pointer;touch-action:none;--t:0}
.track .line{position:absolute;left:0;right:0;top:26px;height:1px;background:var(--rule)}
.track .done{position:absolute;left:0;top:25.5px;height:2px;width:calc(var(--t)*100%);background:var(--gold)}
.track .knob{position:absolute;top:26px;left:calc(var(--t)*100%);width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border:1px solid var(--gold-hi);background:var(--night);transform:rotate(45deg);transition:transform .15s}
.track:hover .knob,.track.is-drag .knob{transform:rotate(45deg) scale(1.25)}
.tick{position:absolute;top:20px;width:1px;height:12px;background:var(--rule)}
.tick.major{top:16px;height:20px;background:var(--gold)}
.tick.minor label{top:24px}
.tick label{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-family:var(--serif);font-size:13px;color:var(--ink-2);white-space:nowrap;letter-spacing:.04em}
.tick.est label::after{content:"";}
.track .note{position:absolute;right:0;top:-6px;font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.src{position:fixed;left:var(--gut);right:var(--gut);bottom:8px;font-size:10px;line-height:1.5;color:var(--ink-3);letter-spacing:.02em}

.tip{position:fixed;pointer-events:none;padding:10px 14px;background:rgba(11,18,32,.94);border-left:1px solid var(--gold);font-size:12px;line-height:1.7;color:var(--ink-2);opacity:0;transition:opacity .15s;min-width:170px}
.tip.on{opacity:1}
.tip b{display:block;font-family:var(--serif);font-weight:600;font-size:16px;color:var(--ink);letter-spacing:.08em}
.tip em{font-style:normal;color:var(--gold-hi);font-variant-numeric:tabular-nums}

  .era .tot b{font-size:19px}

  .time{left:24px;right:24px;bottom:68px;gap:0}

  .tick.minor label{display:none}
  .track .note{display:none}
  .src{font-size:9px;bottom:6px;left:16px;right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      if (e.key === 'End') { o.onGrab(); o.onInput(o.to); }
    });
    return y => { el.style.setProperty('--t', (y - o.from) / (o.to - o.from)); el.setAttribute('aria-valuenow', Math.round(y)); el.setAttribute('aria-valuetext', Math.round(y) + '年'); };
  }

  // 書式
  const fmt = n => Math.round(n).toLocaleString('ja-JP');
  const KD = '〇一二三四五六七八九';
  const kanjiDigits = n => String(n).split('').map(d => KD[+d]).join('');
  function kanjiNum(n) { // 1..99
    const t = Math.floor(n / 10), o = n % 10;
    return (t ? (t > 1 ? KD[t] : '') + '十' : '') + (o ? KD[o] : '');
  }
  const reiwa = y => '令和' + kanjiNum(y - 2018) + '年';
  function lerpColor(stops, t) {
    t = Math.max(0, Math.min(1, t));
    const n = stops.length - 1, i = Math.min(n - 1, Math.floor(t * n)), f = t * n - i;
    const a = stops[i], b = stops[i + 1];
    return `rgb(${Math.round(lerp(a[0], b[0], f))},${Math.round(lerp(a[1], b[1], f))},${Math.round(lerp(a[2], b[2], f))})`;
  }
  const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const densityT = d => Math.max(0, Math.min(1, Math.log10(d + 1) / Math.log10(30000)));

  window.FC = { D, cells, cities: D.cities, meta: D.meta, popAt, densityAt, indexAt, totalAt, cityPopAt, lightState,
    makeProjection, hit, bindTrack, labelPoints, setupCanvas, Player, fmt, kanjiDigits, kanjiNum, reiwa, lerpColor, hex2rgb, densityT,
    SOURCE: '出典：国土数値情報（国土交通省）「1kmメッシュ別将来推計人口データ（R6国政局推計）」「行政区域データ」を加工して作成（CC BY 4.0）。値は2020年国勢調査に基づく推計であり、確定した将来ではありません。' };
})();

</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('map');
  let G, P, lens = 'pop', year = 2020, hover = null;
  const C = {
    sea: 'rgba(60,84,120,.20)', empty: '#121a2a',
    pop: [[22,30,46],[52,46,36],[112,90,46],[188,150,70],[236,204,128],[255,246,222]],
    idxDown: [[98,92,76],[86,122,168],[60,96,150]],
    idxUp: [[98,92,76],[201,164,76],[255,236,180]],
    lo: [[48,66,96],[140,150,150],[232,205,140]],
  };
  const LENS = {
    pop: { ramp: C.pop, labels: [['1,000',.22],['5,000',.45],['20,000人/km²',.83]], desc: 'その年の人口密度（推計）。明るいほど人が多い。人が減ると灯りは静かに落ち、増える場所は明るさを増す。', sw: [] },
    idx: { ramp: [...C.idxDown.slice().reverse(), ...C.idxUp.slice(1)], labels: [['60',0],['80',.25],['100',.5],['110',.75],['120',1]], desc: '2020年を100とした推計人口の指数。青は減る場所、金は増える場所。', sw: [] },
    lo: { ramp: C.lo, labels: [['2025',0],['2045',.44],['2070年',1]], desc: '推計人口が初めて1人未満になる年。2020年に1人未満の地点と秘匿値は対象外。推計であり確定した将来ではない。', sw: [['rgba(0,0,0,0)','2070年以降も灯る','1px solid rgba(201,164,76,.5)'],['#0b1220','推計1人未満','1px dashed #7f9cc0']] },
  };
  function colorOf(c) {
    if (lens === 'pop') return FC.lerpColor(C.pop, Math.min(1, Math.pow(FC.densityAt(c, year) / 30000, .45)));
    if (lens === 'idx') {
      const i = FC.indexAt(c, year); if (i == null) return C.empty;
      return i < 100 ? FC.lerpColor(C.idxDown, (100 - i) / 40) : FC.lerpColor(C.idxUp, (i - 100) / 20);
    }
    return null;
  }
  function draw() {
    if (!G) return;
    const { ctx, w, h } = G;
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, w, h);
    const r = P.r;
    for (const c of FC.cells) {
      if (c.kind === 'out') { ctx.beginPath(); P.hexPath(ctx, c.x, c.y, .9); ctx.strokeStyle = C.sea; ctx.lineWidth = .6; ctx.stroke(); continue; }
      if (c.kind === 'empty') { ctx.beginPath(); P.hexPath(ctx, c.x, c.y, .92); ctx.fillStyle = C.empty; ctx.fill(); continue; }
      ctx.beginPath(); P.hexPath(ctx, c.x, c.y, .9);
      if (lens === 'lo') {
        const st = FC.lightState(c, year);
        if (st === 'none' || st === 'na') { ctx.fillStyle = 'rgba(201,164,76,' + (0.06 + 0.22 * FC.densityT(FC.densityAt(c, year))) + ')'; ctx.fill(); }
        else if (st === 'out') { ctx.setLineDash([2, 2]); ctx.strokeStyle = '#7f9cc0'; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]); }
        else { ctx.fillStyle = FC.lerpColor(C.lo, (c.lo - 2025) / 45); ctx.fill(); }
      } else { ctx.fillStyle = colorOf(c); ctx.fill(); }
    }
    ctx.font = (G.w < 720 ? 11 : 13) + 'px "Shippori Mincho", serif'; ctx.textAlign = 'center';
    for (const L of FC.labelPoints()) { ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(11,18,32,.85)'; ctx.strokeText(L.name, L.x, L.y); ctx.fillStyle = '#e9dfc6'; ctx.fillText(L.name, L.x, L.y); }
    if (hover) { ctx.beginPath(); P.hexPath(ctx, hover.x, hover.y, 1.05); ctx.strokeStyle = '#f3dfa6'; ctx.lineWidth = 1.5; ctx.stroke(); }
  }
  function layout() {
    G = FC.setupCanvas(canvas);
    const m = G.w < 720;
    P = FC.makeProjection(G.w, G.h, m ? { t: 60, r: 12, b: 332, l: 12 } : { t: 28, r: 330, b: 150, l: 300 });
    draw();
  }
  const setKnob = FC.bindTrack($('track'), { onInput: y => { player.pause(); setYear(y); }, onGrab: () => player.pause() });
  function setYear(y) {
    year = y;
    $('yr').textContent = Math.floor(y + 1e-6);
    $('yrKind').textContent = y < 2021 ? '実績' : '推計';
    const t = FC.totalAt(y);
    $('tot').textContent = FC.fmt(t);
    $('ix').textContent = '2020年＝100として ' + (t / FC.totalAt(2020) * 100).toFixed(1);
    setKnob(y); draw(); if (hover) showTip(hover);
  }
  const player = FC.Player({ onYear: setYear, onState: on => {
    $('play').setAttribute('aria-label', on ? '一時停止' : '再生');
    $('playIcon').innerHTML = on ? '<path d="M4 2h3v12H4zM9 2h3v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>';
  }});
  $('play').onclick = () => player.toggle();
  // 目盛り
  const ticks = $('ticks');
  for (let y = 2020; y <= 2050; y += 5) {
    const d = document.createElement('div');
    d.className = 'tick ' + (y % 10 === 0 ? 'major' : 'minor');
    d.style.left = ((y - 2020) / 30 * 100) + '%';
    d.innerHTML = '<label>' + y + '</label>'; ticks.appendChild(d);
  }
  function setLens(l) {
    lens = l;
    document.querySelectorAll('.lenses button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lens === l));
    const L = LENS[l];
    $('ramp').style.background = 'linear-gradient(90deg,' + L.ramp.map(c => 'rgb(' + c + ')').join(',') + ')';
    $('rampLabels').innerHTML = L.labels.map(([s, t]) => '<span style="left:' + t * 100 + '%;transform:translateX(' + (t === 0 ? '0' : t === 1 ? '-100%' : '-50%') + ')">' + s + '</span>').join('');
    $('swatches').innerHTML = L.sw.map(([bg, t, bd]) => '<span><i style="background:' + bg + ';border:' + bd + '"></i>' + t + '</span>').join('');
    $('desc').textContent = L.desc;
    draw();
  }
  document.querySelectorAll('.lenses button').forEach(b => b.onclick = () => setLens(b.dataset.lens));
  function showTip(c) {
    const tip = $('tip');
    if (!c || c.city < 0) { tip.classList.remove('on'); return; }
    const city = FC.cities[c.city], y = Math.floor(year);
    const ix = FC.indexAt(c, year);
    tip.innerHTML = '<b>' + city.name + '</b>' + y + '年　市町村の推計人口 <em>' + FC.fmt(FC.cityPopAt(c.city, year)) + '</em>人<br>この六角形 <em>' + (FC.popAt(c, year) < 1 ? '推計1人未満' : FC.fmt(FC.popAt(c, year)) + '人') + '</em>' + (ix != null ? '　2020年＝100で <em>' + ix.toFixed(0) + '</em>' : '');
    const m = G.w < 720;
    tip.style.left = m ? '16px' : Math.min(G.w - 240, c.x + 16) + 'px';
    tip.style.top = m ? '64px' : Math.max(8, c.y - 70) + 'px';
    tip.classList.add('on');
  }
  canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const c = FC.hit(e.clientX, e.clientY, P.r * 1.2); if (c !== hover) { hover = c; draw(); showTip(c); } });
  canvas.addEventListener('pointerleave', () => { hover = null; draw(); showTip(null); });
  canvas.addEventListener('click', e => { const c = FC.hit(e.clientX, e.clientY, P.r * 1.4); hover = c; draw(); showTip(c); });
  $('src').textContent = FC.SOURCE;
  window.addEventListener('resize', layout);
  setLens(new URLSearchParams(location.search).get('lens') || 'pop');
  layout();
  setYear(+(new URLSearchParams(location.search).get('year') || 2020));
  if (document.fonts) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
